<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 950" width="100%" height="100%" style="background:#0b1120; font-family:'Segoe UI', Inter, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="erdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <!-- Markers for Crow's Foot & Relationships -->
    <marker id="oneToOne" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="6" markerHeight="6" orient="auto">
      <circle cx="6" cy="6" r="4" fill="none" stroke="#38bdf8" stroke-width="2"/>
    </marker>
    <marker id="manyEnd" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 6 L 0 12 M 10 0 L 10 12" fill="none" stroke="#10b981" stroke-width="2"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1450" height="950" fill="url(#erdBg)" />

  <!-- Header -->
  <rect x="50" y="25" width="1350" height="75" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="70" y="42" width="40" height="40" rx="8" fill="#10b981" />
  <path d="M 80 52 L 100 52 M 80 62 L 100 62 M 80 72 L 95 72" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  
  <text x="125" y="58" font-size="22" font-weight="700" fill="#f8fafc">MODELAGEM DO BANCO DE DADOS (ERD) — SQLITE</text>
  <text x="125" y="80" font-size="13" fill="#94a3b8">Esquema Relacional Centralizado (kiwibot.db) • 100% de Persistência Direta • Índices &amp; Chaves Estrangeiras</text>

  <rect x="1150" y="45" width="220" height="35" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
  <text x="1170" y="67" font-size="12" font-weight="600" fill="#38bdf8">PRAGMA foreign_keys = ON</text>

  <!-- ================= ENTITY 1: COMPANIES ================= -->
  <g transform="translate(60, 130)" filter="url(#shadow)">
    <!-- Box Header -->
    <rect width="320" height="38" rx="8" fill="#0369a1" />
    <text x="15" y="24" font-size="14" font-weight="700" fill="#ffffff">COMPANIES (Empresas)</text>
    <rect y="38" width="320" height="200" fill="#1e293b" stroke="#0369a1" stroke-width="1.5" rx="0 0 8 8" />
    
    <!-- Columns -->
    <!-- id PK -->
    <text x="15" y="65" font-size="11" font-weight="700" fill="#38bdf8">PK</text>
    <text x="45" y="65" font-size="12" font-weight="600" fill="#f1f5f9">id</text>
    <text x="210" y="65" font-size="11" fill="#94a3b8">TEXT (Hex 12)</text>
    <line x1="15" y1="75" x2="305" y2="75" stroke="#334155" stroke-width="1" />

    <!-- name UNIQUE -->
    <text x="15" y="95" font-size="11" font-weight="700" fill="#f59e0b">UQ</text>
    <text x="45" y="95" font-size="12" font-weight="600" fill="#f1f5f9">name</text>
    <text x="210" y="95" font-size="11" fill="#94a3b8">TEXT NOT NULL</text>
    <line x1="15" y1="105" x2="305" y2="105" stroke="#334155" stroke-width="1" />

    <!-- website -->
    <text x="45" y="125" font-size="12" fill="#cbd5e1">website</text>
    <text x="210" y="125" font-size="11" fill="#94a3b8">TEXT</text>
    <line x1="15" y1="135" x2="305" y2="135" stroke="#334155" stroke-width="1" />

    <!-- linkedin -->
    <text x="45" y="155" font-size="12" fill="#cbd5e1">linkedin</text>
    <text x="210" y="155" font-size="11" fill="#94a3b8">TEXT</text>
    <line x1="15" y1="165" x2="305" y2="165" stroke="#334155" stroke-width="1" />

    <!-- created_at -->
    <text x="45" y="185" font-size="12" fill="#cbd5e1">created_at</text>
    <text x="210" y="185" font-size="11" fill="#94a3b8">TEXT (ISO-8601)</text>
    <line x1="15" y1="195" x2="305" y2="195" stroke="#334155" stroke-width="1" />

    <!-- updated_at -->
    <text x="45" y="215" font-size="12" fill="#cbd5e1">updated_at</text>
    <text x="210" y="215" font-size="11" fill="#94a3b8">TEXT (ISO-8601)</text>
  </g>

  <!-- ================= ENTITY 2: OPPORTUNITIES (CORE TABLE) ================= -->
  <g transform="translate(480, 130)" filter="url(#shadow)">
    <!-- Box Header -->
    <rect width="450" height="38" rx="8" fill="#059669" />
    <text x="15" y="24" font-size="14" font-weight="700" fill="#ffffff">OPPORTUNITIES (Vagas &amp; Candidaturas)</text>
    <rect y="38" width="450" height="520" fill="#1e293b" stroke="#059669" stroke-width="1.8" rx="0 0 8 8" />

    <!-- Fields -->
    <!-- id -->
    <text x="15" y="65" font-size="11" font-weight="700" fill="#34d399">PK</text>
    <text x="45" y="65" font-size="12" font-weight="600" fill="#f1f5f9">id</text>
    <text x="310" y="65" font-size="11" fill="#94a3b8">TEXT PRIMARY KEY</text>
    <line x1="15" y1="75" x2="435" y2="75" stroke="#334155" stroke-width="1" />

    <!-- title -->
    <text x="45" y="95" font-size="12" font-weight="600" fill="#f1f5f9">title</text>
    <text x="310" y="95" font-size="11" fill="#94a3b8">TEXT NOT NULL</text>
    <line x1="15" y1="105" x2="435" y2="105" stroke="#334155" stroke-width="1" />

    <!-- company_id -->
    <text x="15" y="125" font-size="11" font-weight="700" fill="#38bdf8">FK</text>
    <text x="45" y="125" font-size="12" font-weight="600" fill="#f1f5f9">company_id</text>
    <text x="310" y="125" font-size="11" fill="#94a3b8">TEXT (references companies)</text>
    <line x1="15" y1="135" x2="435" y2="135" stroke="#334155" stroke-width="1" />

    <!-- company_name -->
    <text x="45" y="155" font-size="12" fill="#cbd5e1">company_name</text>
    <text x="310" y="155" font-size="11" fill="#94a3b8">TEXT NOT NULL</text>
    <line x1="15" y1="165" x2="435" y2="165" stroke="#334155" stroke-width="1" />

    <!-- location -->
    <text x="45" y="185" font-size="12" fill="#cbd5e1">location</text>
    <text x="310" y="185" font-size="11" fill="#94a3b8">TEXT DEFAULT 'Brasil'</text>
    <line x1="15" y1="195" x2="435" y2="195" stroke="#334155" stroke-width="1" />

    <!-- work_mode -->
    <text x="45" y="215" font-size="12" fill="#cbd5e1">work_mode</text>
    <text x="310" y="215" font-size="11" fill="#94a3b8">TEXT ('Remoto'|'Híbrido'|...)</text>
    <line x1="15" y1="225" x2="435" y2="225" stroke="#334155" stroke-width="1" />

    <!-- stage -->
    <text x="15" y="245" font-size="11" font-weight="700" fill="#f59e0b">IDX</text>
    <text x="45" y="245" font-size="12" font-weight="600" fill="#fde68a">stage</text>
    <text x="310" y="245" font-size="11" fill="#fde68a">TEXT DEFAULT 'pending'</text>
    <line x1="15" y1="255" x2="435" y2="255" stroke="#334155" stroke-width="1" />

    <!-- url -->
    <text x="45" y="275" font-size="12" fill="#cbd5e1">url</text>
    <text x="310" y="275" font-size="11" fill="#94a3b8">TEXT (URL LinkedIn / Externa)</text>
    <line x1="15" y1="285" x2="435" y2="285" stroke="#334155" stroke-width="1" />

    <!-- date_added -->
    <text x="45" y="305" font-size="12" fill="#cbd5e1">date_added</text>
    <text x="310" y="305" font-size="11" fill="#94a3b8">TEXT NOT NULL</text>
    <line x1="15" y1="315" x2="435" y2="315" stroke="#334155" stroke-width="1" />

    <!-- date_applied -->
    <text x="45" y="335" font-size="12" fill="#cbd5e1">date_applied</text>
    <text x="310" y="335" font-size="11" fill="#94a3b8">TEXT NULLABLE</text>
    <line x1="15" y1="345" x2="435" y2="345" stroke="#334155" stroke-width="1" />

    <!-- source -->
    <text x="45" y="365" font-size="12" fill="#cbd5e1">source</text>
    <text x="310" y="365" font-size="11" fill="#94a3b8">TEXT</text>
    <line x1="15" y1="375" x2="435" y2="375" stroke="#334155" stroke-width="1" />

    <!-- notes -->
    <text x="45" y="395" font-size="12" fill="#cbd5e1">notes</text>
    <text x="310" y="395" font-size="11" fill="#94a3b8">TEXT</text>
    <line x1="15" y1="405" x2="435" y2="405" stroke="#334155" stroke-width="1" />

    <!-- salary -->
    <text x="45" y="425" font-size="12" fill="#cbd5e1">salary</text>
    <text x="310" y="425" font-size="11" fill="#94a3b8">TEXT</text>
    <line x1="15" y1="435" x2="435" y2="435" stroke="#334155" stroke-width="1" />

    <!-- original_status -->
    <text x="45" y="455" font-size="12" fill="#cbd5e1">original_status</text>
    <text x="310" y="455" font-size="11" fill="#94a3b8">TEXT (Msg do robô/Selenium)</text>
    <line x1="15" y1="465" x2="435" y2="465" stroke="#334155" stroke-width="1" />

    <!-- status (Destaque do novo requisito) -->
    <text x="15" y="485" font-size="11" font-weight="700" fill="#f59e0b">NEW</text>
    <text x="45" y="485" font-size="12" font-weight="700" fill="#fbbf24">status</text>
    <text x="270" y="485" font-size="11" font-weight="600" fill="#fbbf24">'LINK_EXTERNO_NAO_CADASTRADO'</text>
    <line x1="15" y1="495" x2="435" y2="495" stroke="#334155" stroke-width="1" />

    <!-- created_at / updated_at -->
    <text x="45" y="515" font-size="12" fill="#cbd5e1">created_at, updated_at</text>
    <text x="310" y="515" font-size="11" fill="#94a3b8">TEXT (ISO-8601 Timestamps)</text>
  </g>

  <!-- ================= ENTITY 3: ACTIVITIES (AUDIT / TIMELINE) ================= -->
  <g transform="translate(1010, 130)" filter="url(#shadow)">
    <!-- Box Header -->
    <rect width="380" height="38" rx="8" fill="#7c3aed" />
    <text x="15" y="24" font-size="14" font-weight="700" fill="#ffffff">ACTIVITIES (Linha do Tempo)</text>
    <rect y="38" width="380" height="235" fill="#1e293b" stroke="#7c3aed" stroke-width="1.5" rx="0 0 8 8" />

    <!-- Fields -->
    <!-- id -->
    <text x="15" y="65" font-size="11" font-weight="700" fill="#a78bfa">PK</text>
    <text x="45" y="65" font-size="12" font-weight="600" fill="#f1f5f9">id</text>
    <text x="240" y="65" font-size="11" fill="#94a3b8">TEXT PRIMARY KEY</text>
    <line x1="15" y1="75" x2="365" y2="75" stroke="#334155" stroke-width="1" />

    <!-- opportunity_id -->
    <text x="15" y="95" font-size="11" font-weight="700" fill="#38bdf8">FK</text>
    <text x="45" y="95" font-size="12" font-weight="600" fill="#f1f5f9">opportunity_id</text>
    <text x="240" y="95" font-size="11" fill="#94a3b8">TEXT (CASCADE DEL)</text>
    <line x1="15" y1="105" x2="365" y2="105" stroke="#334155" stroke-width="1" />

    <!-- event_type -->
    <text x="45" y="125" font-size="12" font-weight="600" fill="#cbd5e1">event_type</text>
    <text x="240" y="125" font-size="11" fill="#94a3b8">TEXT NOT NULL</text>
    <line x1="15" y1="135" x2="365" y2="135" stroke="#334155" stroke-width="1" />

    <!-- prev_value / new_value -->
    <text x="45" y="155" font-size="12" fill="#cbd5e1">prev_value, new_value</text>
    <text x="240" y="155" font-size="11" fill="#94a3b8">TEXT</text>
    <line x1="15" y1="165" x2="365" y2="165" stroke="#334155" stroke-width="1" />

    <!-- description -->
    <text x="45" y="185" font-size="12" fill="#cbd5e1">description</text>
    <text x="240" y="185" font-size="11" fill="#94a3b8">TEXT NOT NULL</text>
    <line x1="15" y1="195" x2="365" y2="195" stroke="#334155" stroke-width="1" />

    <!-- created_at -->
    <text x="15" y="215" font-size="11" font-weight="700" fill="#f59e0b">IDX</text>
    <text x="45" y="215" font-size="12" fill="#cbd5e1">created_at</text>
    <text x="240" y="215" font-size="11" fill="#94a3b8">TEXT (Timestamp)</text>
  </g>

  <!-- ================= ENTITY 4: BOT RUNS (EXECUTION LOGS) ================= -->
  <g transform="translate(1010, 410)" filter="url(#shadow)">
    <!-- Box Header -->
    <rect width="380" height="38" rx="8" fill="#d97706" />
    <text x="15" y="24" font-size="14" font-weight="700" fill="#ffffff">BOT_RUNS (Execuções do Robô)</text>
    <rect y="38" width="380" height="235" fill="#1e293b" stroke="#d97706" stroke-width="1.5" rx="0 0 8 8" />

    <!-- Fields -->
    <text x="15" y="65" font-size="11" font-weight="700" fill="#fde68a">PK</text>
    <text x="45" y="65" font-size="12" font-weight="600" fill="#f1f5f9">id</text>
    <text x="240" y="65" font-size="11" fill="#94a3b8">TEXT PRIMARY KEY</text>
    <line x1="15" y1="75" x2="365" y2="75" stroke="#334155" stroke-width="1" />

    <text x="45" y="95" font-size="12" fill="#cbd5e1">started_at</text>
    <text x="240" y="95" font-size="11" fill="#94a3b8">TEXT NOT NULL</text>
    <line x1="15" y1="105" x2="365" y2="105" stroke="#334155" stroke-width="1" />

    <text x="45" y="125" font-size="12" fill="#cbd5e1">finished_at</text>
    <text x="240" y="125" font-size="11" fill="#94a3b8">TEXT NULLABLE</text>
    <line x1="15" y1="135" x2="365" y2="135" stroke="#334155" stroke-width="1" />

    <text x="45" y="155" font-size="12" fill="#cbd5e1">vagas_encontradas</text>
    <text x="240" y="155" font-size="11" fill="#94a3b8">INTEGER DEFAULT 0</text>
    <line x1="15" y1="165" x2="365" y2="165" stroke="#334155" stroke-width="1" />

    <text x="45" y="185" font-size="12" fill="#cbd5e1">candidaturas_enviadas</text>
    <text x="240" y="185" font-size="11" fill="#94a3b8">INTEGER DEFAULT 0</text>
    <line x1="15" y1="195" x2="365" y2="195" stroke="#334155" stroke-width="1" />

    <text x="45" y="215" font-size="12" fill="#cbd5e1">run_status, log_output</text>
    <text x="240" y="215" font-size="11" fill="#94a3b8">TEXT ('completed'|'error')</text>
  </g>

  <!-- ================= ENTITY 5 & 6: USERS & SESSIONS (AUTH) ================= -->
  <g transform="translate(60, 420)" filter="url(#shadow)">
    <!-- Box Header: USERS -->
    <rect width="320" height="34" rx="8" fill="#475569" />
    <text x="15" y="22" font-size="13" font-weight="700" fill="#ffffff">USERS (Usuários)</text>
    <rect y="34" width="320" height="150" fill="#1e293b" stroke="#475569" stroke-width="1.2" rx="0 0 8 8" />

    <text x="15" y="58" font-size="11" font-weight="700" fill="#94a3b8">PK</text>
    <text x="45" y="58" font-size="11" font-weight="600" fill="#f1f5f9">id</text>
    <text x="210" y="58" font-size="10" fill="#94a3b8">TEXT</text>
    <line x1="15" y1="67" x2="305" y2="67" stroke="#334155" stroke-width="1" />

    <text x="15" y="85" font-size="11" font-weight="700" fill="#f59e0b">UQ</text>
    <text x="45" y="85" font-size="11" font-weight="600" fill="#f1f5f9">email</text>
    <text x="210" y="85" font-size="10" fill="#94a3b8">TEXT NOT NULL</text>
    <line x1="15" y1="94" x2="305" y2="94" stroke="#334155" stroke-width="1" />

    <text x="45" y="112" font-size="11" fill="#cbd5e1">password_hash, salt</text>
    <text x="210" y="112" font-size="10" fill="#94a3b8">TEXT (SHA-256)</text>
    <line x1="15" y1="121" x2="305" y2="121" stroke="#334155" stroke-width="1" />

    <text x="45" y="139" font-size="11" fill="#cbd5e1">name, role, avatar_url</text>
    <text x="210" y="139" font-size="10" fill="#94a3b8">TEXT</text>
    <line x1="15" y1="148" x2="305" y2="148" stroke="#334155" stroke-width="1" />

    <text x="45" y="166" font-size="11" fill="#cbd5e1">created_at, updated_at</text>
    <text x="210" y="166" font-size="10" fill="#94a3b8">TEXT</text>

    <!-- SESSIONS -->
    <g transform="translate(0, 200)">
      <rect width="320" height="34" rx="8" fill="#475569" />
      <text x="15" y="22" font-size="13" font-weight="700" fill="#ffffff">SESSIONS (Sessões)</text>
      <rect y="34" width="320" height="110" fill="#1e293b" stroke="#475569" stroke-width="1.2" rx="0 0 8 8" />

      <text x="15" y="58" font-size="11" font-weight="700" fill="#94a3b8">PK</text>
      <text x="45" y="58" font-size="11" font-weight="600" fill="#f1f5f9">token</text>
      <text x="210" y="58" font-size="10" fill="#94a3b8">TEXT PRIMARY KEY</text>
      <line x1="15" y1="67" x2="305" y2="67" stroke="#334155" stroke-width="1" />

      <text x="15" y="85" font-size="11" font-weight="700" fill="#38bdf8">FK</text>
      <text x="45" y="85" font-size="11" font-weight="600" fill="#f1f5f9">user_id</text>
      <text x="210" y="85" font-size="10" fill="#94a3b8">TEXT (CASCADE DEL)</text>
      <line x1="15" y1="94" x2="305" y2="94" stroke="#334155" stroke-width="1" />

      <text x="45" y="112" font-size="11" fill="#cbd5e1">created_at, expires_at</text>
      <text x="210" y="112" font-size="10" fill="#94a3b8">TEXT NOT NULL</text>
    </g>
  </g>

  <!-- ================= RELATIONSHIP CONNECTORS ================= -->
  <!-- 1. companies (1) to opportunities (N) -->
  <path d="M 380 255 L 430 255 L 430 255 L 480 255" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-start="url(#oneToOne)" marker-end="url(#manyEnd)" />
  <rect x="400" y="240" width="60" height="22" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
  <text x="412" y="255" font-size="11" font-weight="700" fill="#38bdf8">1 : N</text>

  <!-- 2. opportunities (1) to activities (N) -->
  <path d="M 930 255 L 970 255 L 970 225 L 1010 225" fill="none" stroke="#a78bfa" stroke-width="2.5" marker-start="url(#oneToOne)" marker-end="url(#manyEnd)" />
  <rect x="945" y="230" width="50" height="22" rx="4" fill="#0f172a" stroke="#a78bfa" stroke-width="1" />
  <text x="955" y="245" font-size="11" font-weight="700" fill="#a78bfa">1 : N</text>

  <!-- 3. users (1) to sessions (N) -->
  <path d="M 220 604 L 220 620" fill="none" stroke="#94a3b8" stroke-width="2" marker-start="url(#oneToOne)" marker-end="url(#manyEnd)" />

  <!-- ================= INDEXES & CONSTRAINTS FOOTER BOX ================= -->
  <rect x="60" y="790" width="1330" height="120" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2" filter="url(#shadow)" />
  <text x="85" y="818" font-size="14" font-weight="700" fill="#34d399">ÍNDICES DE PERFORMANCE &amp; INTEGRIDADE RELACIONAL</text>
  
  <text x="85" y="845" font-size="12" fill="#cbd5e1">• <tspan font-weight="700" fill="#f8fafc">idx_opportunities_stage:</tspan> Otimiza filtros do Kanban, Funil de Conversão e contadores rápidos.</text>
  <text x="85" y="865" font-size="12" fill="#cbd5e1">• <tspan font-weight="700" fill="#f8fafc">idx_opportunities_company_id:</tspan> Permite junções instantâneas (JOINs) entre vagas e seus detalhes de empresa.</text>
  <text x="85" y="885" font-size="12" fill="#cbd5e1">• <tspan font-weight="700" fill="#f8fafc">idx_activities_opportunity_id &amp; idx_activities_created_at:</tspan> Acelera a renderização da timeline de atividades.</text>

  <text x="750" y="845" font-size="12" fill="#cbd5e1">• <tspan font-weight="700" fill="#f8fafc">ON DELETE CASCADE (activities):</tspan> Exclusão limpa de atividades ao deletar uma vaga.</text>
  <text x="750" y="865" font-size="12" fill="#cbd5e1">• <tspan font-weight="700" fill="#f8fafc">ON DELETE SET NULL (opportunities):</tspan> Preserva registros de vagas mesmo se a empresa for excluída.</text>
  <text x="750" y="885" font-size="12" fill="#f59e0b" font-weight="600">• Fila de Isolamento: <tspan fill="#fbbf24">opportunities.status = 'LINK_EXTERNO_NAO_CADASTRADO'</tspan> para triagem posterior.</text>
</svg>
