<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1550 1100" width="100%" height="100%" style="background:#0b1120; font-family:'Segoe UI', Inter, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="seqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <marker id="arrowSolid" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowKiwi" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1550" height="1100" fill="url(#seqBg)" />

  <!-- Header -->
  <rect x="50" y="20" width="1450" height="75" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />
  <circle cx="85" cy="57" r="20" fill="#f59e0b" />
  <path d="M 85 45 L 85 58 L 95 65" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <text x="120" y="52" font-size="20" font-weight="700" fill="#f8fafc">DIAGRAMA DE SEQUÊNCIA UML: FLUXO DE EXECUÇÃO &amp; VERIFICAÇÃO</text>
  <text x="120" y="74" font-size="13" fill="#94a3b8">Isolamento de Links Externos • Persistência Direta em SQLite • Rotina de Expurgo de CSV • Sem E-mails</text>

  <rect x="1250" y="40" width="230" height="34" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
  <text x="1265" y="62" font-size="12" font-weight="600" fill="#34d399">✓ FLUXO REATORADO v2.0</text>

  <!-- ================= PARTICIPANTS / LIFELINES ================= -->
  <!-- 1. Operador / Usuário -->
  <g transform="translate(70, 115)">
    <rect width="140" height="42" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="70" y="26" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">Dashboard / User</text>
    <line x1="70" y1="42" x2="70" y2="920" stroke="#334155" stroke-width="1.5" stroke-dasharray="4" />
  </g>

  <!-- 2. Dashboard Runner (Node.js) -->
  <g transform="translate(280, 115)">
    <rect width="160" height="42" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="80" y="26" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">Runner (server.js)</text>
    <line x1="80" y1="42" x2="80" y2="920" stroke="#334155" stroke-width="1.5" stroke-dasharray="4" />
  </g>

  <!-- 3. Bot Engine (Python) -->
  <g transform="translate(520, 115)">
    <rect width="180" height="42" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <text x="90" y="26" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle">Bot Engine (main / verifier)</text>
    <line x1="90" y1="42" x2="90" y2="920" stroke="#334155" stroke-width="1.5" stroke-dasharray="4" />
  </g>

  <!-- 4. Database Layer (database.py / SQLite) -->
  <g transform="translate(780, 115)">
    <rect width="180" height="42" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <text x="90" y="26" font-size="13" font-weight="700" fill="#34d399" text-anchor="middle">SQLite (kiwibot.db)</text>
    <line x1="90" y1="42" x2="90" y2="920" stroke="#334155" stroke-width="1.5" stroke-dasharray="4" />
  </g>

  <!-- 5. Selenium WebDriver -->
  <g transform="translate(1040, 115)">
    <rect width="170" height="42" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5" />
    <text x="85" y="26" font-size="13" font-weight="700" fill="#c084fc" text-anchor="middle">Selenium / Chrome</text>
    <line x1="85" y1="42" x2="85" y2="920" stroke="#334155" stroke-width="1.5" stroke-dasharray="4" />
  </g>

  <!-- 6. Target: LinkedIn / Ext Portal -->
  <g transform="translate(1290, 115)">
    <rect width="170" height="42" rx="8" fill="#1e293b" stroke="#0077b5" stroke-width="1.5" />
    <text x="85" y="26" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">LinkedIn &amp; Vagas</text>
    <line x1="85" y1="42" x2="85" y2="920" stroke="#334155" stroke-width="1.5" stroke-dasharray="4" />
  </g>

  <!-- ================= SEQUENCE STEPS ================= -->
  
  <!-- Step 1: User triggers action -->
  <path d="M 140 190 L 358 190" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowSolid)" />
  <text x="160" y="182" font-size="12" font-weight="600" fill="#38bdf8">1. Solicita "Executar Bot" ou "Verificar Status"</text>

  <!-- Step 2: Runner spawns bot -->
  <path d="M 360 220 L 608 220" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowSolid)" />
  <text x="380" y="212" font-size="12" font-weight="600" fill="#f8fafc">2. spawn python -u (main.py / status_verifier.py)</text>

  <!-- Step 3: Bot purges CSVs initially -->
  <path d="M 610 250 L 868 250" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrowKiwi)" />
  <text x="630" y="242" font-size="12" font-weight="600" fill="#34d399">3. purgar_arquivos_csv() (limpa resíduos CSV)</text>

  <!-- Step 4: Register Bot Run in SQLite -->
  <path d="M 610 280 L 868 280" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrowKiwi)" />
  <text x="630" y="272" font-size="12" fill="#cbd5e1">4. INSERT INTO bot_runs (status='running')</text>

  <!-- Step 5: Init Browser & Login -->
  <path d="M 610 320 L 1123 320" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowSolid)" />
  <text x="750" y="312" font-size="12" fill="#e2e8f0">5. init_browser() &amp; autentica sessão</text>

  <path d="M 1125 345 L 1373 345" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowSolid)" />
  <text x="1145" y="338" font-size="12" fill="#38bdf8">6. GET /jobs/search ou página da vaga</text>

  <!-- LOOP CONTAINER -->
  <rect x="110" y="380" width="1380" height="490" rx="10" fill="#1e293b" fill-opacity="0.3" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6" />
  <rect x="110" y="380" width="220" height="26" rx="6" fill="#f59e0b" />
  <text x="120" y="398" font-size="12" font-weight="700" fill="#0b1120">LOOP: Para cada Vaga Encontrada</text>

  <!-- Card Inspection -->
  <path d="M 1375 425 L 1125 425" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrowDash)" />
  <text x="1150" y="418" font-size="12" fill="#94a3b8">7. Extrai título, empresa, local e link de candidatura</text>

  <!-- DECISION 1: EXTERNAL LINK CHECK -->
  <rect x="540" y="445" width="480" height="150" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2" />
  <text x="555" y="468" font-size="12" font-weight="700" fill="#fbbf24">[DECISÃO]: O Link da candidatura é Externo (Fora do LinkedIn)?</text>
  
  <!-- Query DB if registered -->
  <path d="M 610 500 L 868 500" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrowKiwi)" />
  <text x="630" y="492" font-size="12" fill="#cbd5e1">SELECT COUNT(*) FROM opportunities WHERE url = ?</text>

  <path d="M 870 525 L 612 525" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="3" marker-end="url(#arrowDash)" />
  <text x="640" y="520" font-size="11" fill="#94a3b8">Retorna: 0 (Não cadastrado previamente)</text>

  <!-- ISOLATE RECORD DIRECTLY TO DB -->
  <path d="M 610 570 L 868 570" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrowAmber)" />
  <text x="630" y="555" font-size="12" font-weight="700" fill="#fbbf24">8. ISOLA REGISTRO NO BANCO DE DADOS:</text>
  <text x="630" y="575" font-size="11" fill="#fde68a">status = 'LINK_EXTERNO_NAO_CADASTRADO' (NÃO TENTA CANDIDATAR)</text>

  <!-- DECISION 2: EASY APPLY / LINKEDIN -->
  <rect x="540" y="610" width="800" height="240" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
  <text x="555" y="632" font-size="12" font-weight="700" fill="#34d399">[FLUXO EASY APPLY]: Candidatura Simplificada</text>

  <!-- Alt branch A: Verification Mode -->
  <text x="555" y="655" font-size="12" font-weight="600" fill="#38bdf8">A. Se Modo = "Verificar Estado" (status_verifier.py):</text>
  <path d="M 610 675 L 1123 675" fill="none" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrowSolid)" />
  <text x="630" y="670" font-size="11" fill="#cbd5e1">Inspeciona estado (Já candidatou? Em análise? Encerrada?)</text>
  
  <path d="M 610 705 L 868 705" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrowKiwi)" />
  <text x="630" y="698" font-size="11" font-weight="600" fill="#10b981">Atualiza stage/status no SQLite + registra activity de verificação</text>

  <!-- Alt branch B: Apply Mode -->
  <text x="555" y="735" font-size="12" font-weight="600" fill="#a78bfa">B. Se Modo = "Executar Bot" (main.py):</text>
  <path d="M 610 755 L 1123 755" fill="none" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#arrowSolid)" />
  <text x="630" y="750" font-size="11" fill="#e2e8f0">Preenche formulário Easy Apply e submete</text>

  <path d="M 610 785 L 868 785" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowKiwi)" />
  <text x="630" y="778" font-size="11" font-weight="700" fill="#34d399">Grava diretamente no SQLite: stage = 'applied', activity='candidatura_enviada'</text>

  <rect x="555" y="805" width="450" height="30" rx="4" fill="#1e293b" stroke="#10b981" />
  <text x="565" y="825" font-size="11" font-weight="600" fill="#10b981">✓ SEM CSV &amp; SEM DISPARO DE E-MAILS (Persistência 100% Direta)</text>

  <!-- FINALIZE RUN & PURGE CSVS -->
  <path d="M 610 900 L 868 900" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrowKiwi)" />
  <text x="630" y="892" font-size="12" font-weight="600" fill="#34d399">9. purgar_arquivos_csv() no encerramento (limpeza obrigatória)</text>

  <path d="M 610 930 L 868 930" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrowKiwi)" />
  <text x="630" y="922" font-size="12" fill="#cbd5e1">10. UPDATE bot_runs SET run_status='completed'</text>

  <path d="M 610 960 L 362 960" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowSolid)" />
  <text x="400" y="952" font-size="12" fill="#38bdf8">11. Processo finalizado (código 0)</text>

  <path d="M 360 990 L 142 990" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowSolid)" />
  <text x="160" y="982" font-size="12" font-weight="600" fill="#38bdf8">12. Notifica interface &amp; recarrega dados direto do SQLite</text>

  <!-- Footer Info -->
  <rect x="50" y="1030" width="1450" height="50" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="70" y="1060" font-size="12" fill="#94a3b8">Garantia Arquitetural: Gravação em tempo real no SQLite com PRAGMA WAL. Isolamento instantâneo de links externos com status <tspan fill="#fbbf24" font-weight="700">LINK_EXTERNO_NAO_CADASTRADO</tspan>.</text>
</svg>
